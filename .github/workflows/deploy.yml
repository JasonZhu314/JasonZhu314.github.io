# GitHub Actions workflow: Build Next.js site and deploy to GitHub Pages
#
# HOW IT WORKS:
# 1. On every push to `main`, this workflow runs.
# 2. It installs dependencies, builds the static site (next build → out/).
# 3. Uploads the `out/` folder as a GitHub Pages artifact.
# 4. Deploys the artifact to your GitHub Pages URL.
#
# PREREQUISITES:
# - Repository Settings → Pages → Source must be set to "GitHub Actions"

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npx next build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
